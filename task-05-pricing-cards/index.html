<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 05 — Pricing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- TODO: use Flexbox — .pricing-row should lay out the .pricing-card
       items in a row, with the .featured card visually emphasized
       (e.g. flex-grow or transform: scale), and the row should wrap
       onto multiple lines on narrow screens -->
  <main class="pricing-row">
    <article class="pricing-card">
      <h2>Basic</h2>
      <p class="price">$0/mo</p>
      <ul>
        <li>Feature one</li>
        <li>Feature two</li>
      </ul>
      <button type="button">Choose plan</button>
    </article>
    <article class="pricing-card featured">
      <h2>Pro</h2>
      <p class="price">$0/mo</p>
      <ul>
        <li>Feature one</li>
        <li>Feature two</li>
        <li>Feature three</li>
      </ul>
      <button type="button">Choose plan</button>
    </article>
    <article class="pricing-card">
      <h2>Enterprise</h2>
      <p class="price">$0/mo</p>
      <ul>
        <li>Feature one</li>
        <li>Feature two</li>
      </ul>
      <button type="button">Choose plan</button>
    </article>
  </main>
</body>
</html>
