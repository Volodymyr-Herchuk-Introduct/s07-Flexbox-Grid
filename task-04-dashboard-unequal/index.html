<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 04 — Dashboard (Unequal Panels)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- TODO: use CSS Grid with grid-template-areas — .dashboard needs one
       large chart panel and several smaller stat-tile panels of unequal
       size arranged around it -->
  <main class="dashboard">
    <section class="panel chart-panel">
      <h2>Revenue over time</h2>
      <div class="img-placeholder"></div>
    </section>
    <section class="panel stat-tile">
      <h3>Total Users</h3>
      <p class="stat-value">0</p>
    </section>
    <section class="panel stat-tile">
      <h3>Active Sessions</h3>
      <p class="stat-value">0</p>
    </section>
    <section class="panel stat-tile">
      <h3>Conversion Rate</h3>
      <p class="stat-value">0%</p>
    </section>
    <section class="panel stat-tile">
      <h3>Avg. Order Value</h3>
      <p class="stat-value">$0</p>
    </section>
  </main>
</body>
</html>
